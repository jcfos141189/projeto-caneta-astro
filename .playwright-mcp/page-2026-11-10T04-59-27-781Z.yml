              - paragraph [ref=f28e156]: A BNI Nikiti 0.1 é a pedra angular da nossa engenharia de escrita técnica. Fruto de 18 meses de testes balísticos e fluidodinâmicos, este instrumento entrega um traço contínuo de 0.10mm sem interrupções microscópicas. O corpo em alumínio aeroespacial 7075-T6 dissipa o calor do toque e mantém o fluxo de nanquim em pressão barométrica neutra, mesmo em traçados rápidos.
